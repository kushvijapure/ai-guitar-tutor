name: CI

on:
  push:
    branches: [main, conservative-beta]
  pull_request:
  workflow_dispatch:

# Read-only by default. Nothing in this workflow publishes, comments, or writes
# back to the repository, so it should not be able to.
permissions:
  contents: read

# Cancel superseded runs on the same ref rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # vite and oxlint both declare engines ^20.19.0 || >=22.12.0, so all
        # three of these are supported. The DSP is pure arithmetic and should
        # not be version-sensitive; the matrix is here to catch it if that ever
        # stops being true.
        node: ['20', '22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm run build` triggers a prebuild that stages MediaPipe assets, which
      # includes downloading a ~7.8 MB model from storage.googleapis.com. The
      # fetch script skips the download when the file is already present, so
      # caching it keeps CI off a third-party host on most runs.
      - name: Cache MediaPipe model
        uses: actions/cache@v4
        with:
          path: public/models
          key: mediapipe-model-${{ hashFiles('src/lib/mediapipeAssets.ts') }}

      # `npm ci` installs strictly from the lockfile and fails if package.json
      # and the lockfile disagree. It never writes the lockfile.
      - name: Install
        run: npm ci

      - name: Verify the lockfile was not modified
        run: git diff --exit-code -- package-lock.json package.json

      # typecheck -> lint -> test -> verify -> build, defined in package.json so
      # the same command runs locally and here.
      - name: Run CI pipeline
        run: npm run ci

      # Diagnostic, captured in the log so a threshold change shows its effect
      # on every scenario in the PR rather than only in someone's shell.
      - name: Gate measurements
        run: npm run measure

      # Informational. CI runners are too noisy for a pass/fail perf gate, so
      # this records numbers rather than asserting on them.
      - name: Benchmark
        run: npm run bench
        continue-on-error: true
